[pytest]
testpaths = tests
addopts = -ra
markers =
    integration: browser UI and api.js integration with deterministic in-browser fake API (no Prism)
    smoke: basic page and navigation checks
    products: product discovery, search, sorting, and details
    auth: authentication and profile actions
    cart: cart actions
    mutating: updates backend state (requires --allow-mutations in real mode)
    account_changes: changes or creates account data (requires --allow-account-changes in real mode)
    deletion: permanently deletes an account (requires --allow-account-deletion in real mode)
# Dump Python thread stacks if a test/fixture takes unusually long.
# Does not abort the test; useful for locating stalls.
faulthandler_timeout = 45
